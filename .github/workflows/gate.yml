name: gate

on:
  push:
    paths:
      - 'scripts/quality_gate.py'
      - 'scripts/gate_profiles.py'
      - 'scripts/gate_*.py'
      - 'scripts/stem_gate.py'
      - 'scripts/naturalness_check.py'
      - 'scripts/pipeline.py'
      - 'tests/test_gate_*.py'
      - 'tests/test_stem_gate.py'
      - 'tests/gate_defects.py'
      - 'tests/gate_fixture.py'
      - 'tests/bench_gate.py'
      - 'tests/fixtures/gate/**'
      - '.github/workflows/gate.yml'
  pull_request:
    paths:
      - 'scripts/quality_gate.py'
      - 'scripts/gate_profiles.py'
      - 'scripts/gate_*.py'
      - 'scripts/stem_gate.py'
      - 'tests/test_gate_*.py'
      - 'tests/test_stem_gate.py'
      - 'tests/fixtures/gate/**'
      - '.github/workflows/gate.yml'

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install the measurement stack
        run: python -m pip install --upgrade pip numpy scipy soundfile pyloudnorm librosa matplotlib
      - name: Defect matrix
        run: python tests/gate_defects.py --matrix --out ci/defect_matrix.json
      - name: Gate tests
        run: |
          python -m unittest \
            tests.test_gate_defects \
            tests.test_gate_checks \
            tests.test_stem_gate \
            tests.test_gate_new_rows \
            tests.test_gate_audio_cache \
            tests.test_gate_no_loosening \
            tests.test_gate_profiles \
            tests.test_gate_ambient \
            tests.test_vocal_gate \
            tests.test_metadata_and_direction
      - name: Timings
        run: python tests/bench_gate.py --runs 5 --out ci/gate_timings.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-results
          path: ci/
